<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Configuración de fontconfig para los filtros de FFmpeg empaquetados (subtitles/drawtext via libass/freetype).
  Solo fuentes del sistema macOS: no depende de /opt/homebrew/etc ni de fuentes instaladas por el desarrollador.
-->
<fontconfig>
  <dir>/System/Library/Fonts</dir>
  <dir>/System/Library/Fonts/Supplemental</dir>
  <dir>/Library/Fonts</dir>
  <dir>~/Library/Fonts</dir>
  <cachedir>~/Library/Caches/Snipra/fontconfig</cachedir>
  <config></config>
</fontconfig>
