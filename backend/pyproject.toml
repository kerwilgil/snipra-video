[project]
name = "snipra"
version = "1.0.0"
description = "Snipra — auto-clipper local: sube un video y obtén clips optimizados por plataforma (9:16 / 1:1 / 16:9) con subtítulos y hook."
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "anthropic>=0.40",
    "openai>=1.55",
    "yt-dlp>=2026.7.4",
    # Impersonacion TLS para yt-dlp. Sin ella, los sitios detras de Cloudflare
    # (Kick, entre otros) responden 404/403 a la API y la descarga falla con un
    # error que no explica nada. El rango lo impone yt_dlp/networking/_curlcffi.py.
    "curl-cffi>=0.10,<0.16",
    "faster-whisper>=1.1.0",
    "httpx>=0.27",
    "jsonschema>=4.26.0",
]

[project.optional-dependencies]
# Visión / reframe con tracking. Pesadas y sensibles a la versión de Python.
# Si fallan en 3.13, el pipeline degrada a center-crop / blur (ver REFRAME_MODE).
vision = [
    "opencv-python>=4.10",
    "ultralytics>=8.3",
    "mediapipe>=0.10.18",
    "scenedetect>=0.6.4",
    "rapidocr-onnxruntime>=1.4.4",
    # Deteccion real de cara (SCRFD) para el reframe track/auto: mas precisa que
    # la aproximacion por bbox de persona de YOLO, que sigue de respaldo cuando
    # uniface no encuentra ninguna cara (perfil, de espaldas, plano lejano).
    "uniface>=3.7.1",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: FastAPI usa Depends()/File() en defaults por diseño.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# conftest fija env ANTES de importar la app (config se cachea al importar).
"tests/conftest.py" = ["E402"]
# fixtures con JSON literal de ejemplo pueden pasar de 100 chars.
"tests/test_llm_detection.py" = ["E501"]
# 1.5F/1.5G: fixtures con dataclasses/tuplas literales de ejemplo (ComponentScore,
# listas parametrize, EventPoolItem) que pasan de 100 chars - pre-existentes y no
# relacionadas con la migracion de contrato VIA v2 (VideoObservationNature ->
# EvidenceNature) hecha en 1.6B Block 02C.
"tests/test_event_pool.py" = ["E501"]
"tests/test_event_clustering.py" = ["E501"]
# Tests contienen fixtures, datos de ejemplo y aserciones detalladas que pueden
# exceder el ancho de linea o tienen importaciones locales para aislamiento.
# Solo se ignoran errores de formato/estilo, no de correctness.
"tests/**" = ["E501", "B905", "F541", "B011", "I001", "F401", "B007", "SIM117", "E741", "E722", "SIM105", "F601"]
# App files with complex algorithms that are hard to break into shorter lines
"app/pipeline/topic_timeline.py" = ["E501"]
"app/pipeline/highlight_boundaries.py" = ["E501"]
"app/pipeline/highlight_scoring.py" = ["E501"]
"app/pipeline/event_clustering.py" = ["E501"]
"app/pipeline/event_pool.py" = ["E501"]
"app/editor/short_orchestrator.py" = ["E501"]
"app/editor/generation_task_service.py" = ["E501"]
"app/editor/service.py" = ["E501"]
"app/core/db.py" = ["E501"]
"app/api/editor.py" = ["E501"]
"app/editor/director_bridge.py" = ["E501"]
"app/editor/events.py" = ["E501"]
"app/editor/verification.py" = ["E501"]
"app/editor/timeline.py" = ["E501"]
"app/editor/short_models.py" = ["E501"]
"app/api/channels.py" = ["E501"]
"app/video_intelligence/service.py" = ["E501"]
"app/video_intelligence/registry.py" = ["E501"]
"app/video_intelligence/chunking.py" = ["E501"]
"app/video_intelligence/cache.py" = ["E501"]
"app/video_intelligence/__init__.py" = ["E501"]
"app/video_intelligence/models.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = false
