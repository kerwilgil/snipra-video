name: Release source parity

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/release-parity.yml'
      - 'backend/app/core/config.py'
      - 'backend/app/pipeline/transcribe.py'
      - 'backend/app/worker/runner.py'
      - 'backend/tests/test_worker.py'
      - 'backend/tests/test_transcribe_audio_input.py'
      - 'backend/pyproject.toml'
      - 'backend/uv.lock'
      - 'frontend/**'
      - 'scripts/macos/**'
      - 'docs/RELEASE_1_0_0_TRACEABILITY.md'

permissions:
  contents: read

jobs:
  affected-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Channels and retention settings
        working-directory: frontend
        run: npm test -- src/pages/ChannelsPage.test.tsx src/pages/SettingsPage.test.tsx
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - name: Install locked backend dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Worker retention and transcription
        working-directory: backend
        run: uv run --frozen pytest tests/test_worker.py tests/test_transcribe_audio_input.py -q
      - name: macOS packaging gates (stubs only)
        run: |
          uv run --project backend --frozen python -m unittest discover -s scripts/macos/tests -v
          bash -n scripts/macos/build-macos-app.sh
